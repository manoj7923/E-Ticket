version: '3.8'

services:
  web:
    build: .
    container_name: wr_eticket_web
    restart: always
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=railway_user
      - DB_PASSWORD=railway_secret
      - DB_NAME=test
      - DB_PORT=3306
    depends_on:
      - db
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8.0
    container_name: wr_eticket_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pass
      MYSQL_DATABASE: test
      MYSQL_USER: railway_user
      MYSQL_PASSWORD: railway_secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wr_eticket_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_secret_pass
    depends_on:
      - db

volumes:
  db_data:
